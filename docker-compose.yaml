services:
  qa-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa-bot
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
      - db:/db
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "all"
              capabilities: [gpu]

volumes:
  db:
